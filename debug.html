<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThemeParks.wiki API Inspector & Park Auditor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐛</text></svg>">
  <style>
    [data-theme="dark"] {
      --bg: #090d16;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --code-bg: #0f172a;
      --success: #4ade80;
      --error: #fca5a5;
      --warning: #fde047;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --accent: #0284c7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --code-bg: #f1f5f9;
      --success: #15803d;
      --error: #b91c1c;
      --warning: #a16207;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1.5rem; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; gap: 1.5rem; max-width: 1200px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.5rem; color: var(--accent); display: flex; align-items: center; gap: 0.5rem; }
    
    .nav-back { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.85rem; transition: border-color 0.2s; }
    .nav-back:hover { border-color: var(--accent); color: var(--accent); }

    .control-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    
    select, input[type="text"] { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.9rem; outline: none; flex: 1; min-width: 250px; }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }
    
    button { background: var(--accent); color: #ffffff; border: none; padding: 0.6rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
    button:hover { opacity: 0.9; }

    .btn-audit { background: #10b981; }

    .preset-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; max-height: 120px; overflow-y: auto; padding: 0.25rem; }
    .preset-btn { background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    .preset-btn:hover { border-color: var(--accent); color: var(--accent); }

    .output-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; flex: 1; min-height: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .output-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    
    pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow: auto; font-family: monospace; font-size: 0.85rem; color: var(--accent); max-height: 600px; flex: 1; }
    
    .audit-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.88rem; }
    .audit-table th, .audit-table td { border: 1px solid var(--border); padding: 0.6rem 0.8rem; text-align: left; }
    .audit-table th { background: var(--code-bg); color: var(--accent); font-weight: 700; }
    .badge-status { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
    .badge-status.ok { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .badge-status.empty { background: rgba(234, 179, 8, 0.15); color: var(--warning); }
    .badge-status.error { background: rgba(239, 68, 68, 0.15); color: var(--error); }
    .badge-status.unmapped { background: rgba(148, 163, 184, 0.15); color: var(--muted); }

    .status-pill { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .status-pill.success { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .status-pill.error { background: rgba(239, 68, 68, 0.15); color: var(--error); }
  </style>
</head>
<body>

  <header>
    <h1><span>🐛</span> ThemeParks.wiki API Inspector & Auditor</h1>
    <a href="index.html" class="nav-back">← Back to Main App</a>
  </header>

  <div class="control-panel">
    <div class="row">
      <select id="endpointSelect">
        <option value="live">GET /v1/entity/{id}/live (Live Wait Times & Status)</option>
        <option value="children">GET /v1/entity/{id}/children (Rides, Shows & Restaurants)</option>
        <option value="schedule">GET /v1/entity/{id}/schedule (Operating Hours)</option>
        <option value="entity">GET /v1/entity/{id} (Metadata & Details)</option>
        <option value="destinations">GET /v1/destinations (All Global Resorts)</option>
      </select>

      <input type="text" id="uuidInput" placeholder="Enter Entity UUID..." value="75ea578a-adc8-4116-a54d-dccb60765ef9">
      <button id="sendBtn">Send Request</button>
      <button class="btn-audit" id="auditBtn">⚡ Audit Spreadsheet Parks</button>
    </div>

    <div>
      <div style="font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem;">Quick Preset UUIDs (Loaded from Spreadsheet & Map):</div>
      <div class="preset-btns" id="presetButtonsContainer">
        <span style="font-size: 0.8rem; color: var(--muted);">Loading spreadsheet parks...</span>
      </div>
    </div>
  </div>

  <div class="output-container">
    <div class="output-header">
      <span id="responseStatusLabel">Response Payload</span>
      <span id="statusCodeBadge" class="status-pill success" style="display: none;">HTTP 200 OK</span>
    </div>
    <div id="outputContentContainer" style="flex: 1; display: flex; flex-direction: column;">
      <pre id="jsonOutput">Select an endpoint, click "Send Request", or run "Audit Spreadsheet Parks" to test all parks from your sheet...</pre>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzrZD7tmZInw2SNc4401D8zliFoIVsFU_0qkPjjPH34LmJH-XTBU1EPyi0nf9c0fmrB/exec';

    const THEME_PARKS_WIKI_IDS = {
      'magic kingdom': '75ea578a-adc8-4116-a54d-dccb60765ef9',
      'magic kingdom park': '75ea578a-adc8-4116-a54d-dccb60765ef9',
      'epcot': '47f90d2c-e191-4239-a466-5892ef59a88b',
      'animal kingdom': '1c84a229-8862-4648-9c71-378ddd2c7693',
      'disney\'s animal kingdom': '1c84a229-8862-4648-9c71-378ddd2c7693',
      'disney\'s animal kingdom theme park': '1c84a229-8862-4648-9c71-378ddd2c7693',
      'hollywood studios': '288747d1-8b4f-4a64-867e-ea7c9b27bad8',
      'disney\'s hollywood studios': '288747d1-8b4f-4a64-867e-ea7c9b27bad8',
      'universal studios florida': 'eb3f4560-2383-4a36-9152-6b3e5ed6bc57',
      'islands of adventure': 'eb68212e-141a-4d43-a616-5c589a19eb14',
      'universal\'s islands of adventure': 'eb68212e-141a-4d43-a616-5c589a19eb14',
      'volcano bay': 'eb68212e-141a-4d43-a616-5c589a19eb14',
      'universal\'s volcano bay': 'eb68212e-141a-4d43-a616-5c589a19eb14',
      'epic universe': 'eb68212e-141a-4d43-a616-5c589a19eb14',
      'universal epic universe': 'eb68212e-141a-4d43-a616-5c589a19eb14',
      'alton towers': '8e6bf2ae-77ac-403d-8e10-d7cd9b6c05d7',
      'blackpool pleasure beach': '66fbd0d1-14dd-4f1a-bb18-5e0b7447f07d',
      'chessington world of adventures': 'c4307928-fc3c-47df-b976-305026751727',
      'chessington': 'c4307928-fc3c-47df-b976-305026751727',
      'disneyland paris': 'e8d0207f-da8a-4048-bec8-117aa946b2c2',
      'europa-park': '85e3b542-af91-4f8a-8d28-445868a7c8fd',
      'flamingo land': '172d77cb-6341-4b3b-8a66-e145dad8dda9',
      'legoland windsor': '7c48a21b-221c-42f8-8339-6334c5f2fb12',
      'thorpe park': 'b08d9272-d070-4580-9fcd-375270b191a7',
      'disneyland park': 'dae968d5-630d-4719-8b06-3d107e944401',
      'disney california adventure': '832fcd51-ea19-4e77-85c7-75d5843b127c'
    };

    let spreadsheetParks = [];

    async function loadSpreadsheetParks() {
      try {
        const res = await fetch(API_URL);
        const rides = await res.json();
        const uniqueParks = [...new Set(rides.map(r => r.park).filter(Boolean))].sort();
        spreadsheetParks = uniqueParks;

        const presetContainer = document.getElementById('presetButtonsContainer');
        presetContainer.innerHTML = '';

        uniqueParks.forEach(parkName => {
          const normKey = parkName.toLowerCase().trim();
          let uuid = THEME_PARKS_WIKI_IDS[normKey];
          if (!uuid) {
            for (const [key, id] of Object.entries(THEME_PARKS_WIKI_IDS)) {
              if (normKey.includes(key) || key.includes(normKey)) { uuid = id; break; }
            }
          }

          const btn = document.createElement('button');
          btn.className = 'preset-btn';
          btn.textContent = uuid ? parkName : `${parkName} (Unmapped)`;
          if (!uuid) btn.style.borderColor = 'var(--error)';
          btn.onclick = () => {
            if (uuid) {
              document.getElementById('uuidInput').value = uuid;
              sendApiRequest();
            } else {
              alert(`Park "${parkName}" has no UUID mapped in THEME_PARKS_WIKI_IDS yet.`);
            }
          };
          presetContainer.appendChild(btn);
        });
      } catch (err) {
        document.getElementById('presetButtonsContainer').innerHTML = '<span style="color: var(--error);">Failed to load parks from spreadsheet.</span>';
      }
    }

    function setPreset(uuid, name) {
      document.getElementById('uuidInput').value = uuid;
      sendApiRequest();
    }

    function restorePreElement() {
      const container = document.getElementById('outputContentContainer');
      container.innerHTML = '<pre id="jsonOutput"></pre>';
    }

    async function sendApiRequest() {
      restorePreElement();
      const endpoint = document.getElementById('endpointSelect').value;
      const uuid = document.getElementById('uuidInput').value.trim();
      const outputEl = document.getElementById('jsonOutput');
      const badgeEl = document.getElementById('statusCodeBadge');
      const statusLabel = document.getElementById('responseStatusLabel');

      let url = '';
      if (endpoint === 'destinations') {
        url = 'https://api.themeparks.wiki/v1/destinations';
      } else {
        if (!uuid) {
          alert('Please enter a valid Entity UUID.');
          return;
        }
        url = `https://api.themeparks.wiki/v1/entity/${uuid}/${endpoint}`;
      }

      outputEl.textContent = `Fetching ${url} ...`;
      badgeEl.style.display = 'none';

      try {
        const start = performance.now();
        const res = await fetch(url);
        const duration = Math.round(performance.now() - start);
        
        statusLabel.textContent = `Response Payload (${duration}ms)`;
        badgeEl.textContent = `HTTP ${res.status} ${res.statusText}`;
        badgeEl.className = res.ok ? 'status-pill success' : 'status-pill error';
        badgeEl.style.display = 'inline-block';

        const data = await res.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        badgeEl.textContent = 'Network Error';
        badgeEl.className = 'status-pill error';
        badgeEl.style.display = 'inline-block';
        outputEl.textContent = `Error executing request: ${err.message}`;
      }
    }

    async function auditAllParks() {
      const container = document.getElementById('outputContentContainer');
      const statusLabel = document.getElementById('responseStatusLabel');
      const badgeEl = document.getElementById('statusCodeBadge');

      badgeEl.style.display = 'none';
      statusLabel.textContent = 'Auditing All Spreadsheet Parks...';
      
      container.innerHTML = '<div style="padding: 1rem; color: var(--muted); font-family: monospace;">Fetching spreadsheet parks and running live endpoint checks...</div>';

      if (spreadsheetParks.length === 0) {
        await loadSpreadsheetParks();
      }

      let resultsHtml = `
        <table class="audit-table">
          <thead>
            <tr>
              <th>Spreadsheet Park Name</th>
              <th>Mapped Entity UUID</th>
              <th>HTTP Status</th>
              <th>Items Found</th>
              <th>Audit Result</th>
            </tr>
          </thead>
          <tbody>
      `;

      for (const parkName of spreadsheetParks) {
        const normKey = parkName.toLowerCase().trim();
        let uuid = THEME_PARKS_WIKI_IDS[normKey];
        if (!uuid) {
          for (const [key, id] of Object.entries(THEME_PARKS_WIKI_IDS)) {
            if (normKey.includes(key) || key.includes(normKey)) { uuid = id; break; }
          }
        }

        if (!uuid) {
          resultsHtml += `
            <tr>
              <td><strong>${parkName}</strong></td>
              <td><code style="color: var(--error);">Not Mapped</code></td>
              <td>-</td>
              <td>-</td>
              <td><span class="badge-status unmapped">⚠️ Unmapped in Dictionary</span></td>
            </tr>
          `;
          continue;
        }

        const url = `https://api.themeparks.wiki/v1/entity/${uuid}/live`;
        let statusText = 'Checking...';
        let itemCount = '-';
        let badgeClass = 'empty';
        let badgeLabel = 'Pending';

        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            const items = data.liveData || data.live || [];
            itemCount = items.length;
            statusText = `HTTP ${res.status} OK`;
            if (itemCount > 0) {
              badgeClass = 'ok';
              badgeLabel = `✅ Working (${itemCount} items)`;
            } else {
              badgeClass = 'empty';
              badgeLabel = `⚠️ 0 Items Returned`;
            }
          } else {
            statusText = `HTTP ${res.status} ${res.statusText}`;
            badgeClass = 'error';
            badgeLabel = `❌ Failed (${res.status})`;
          }
        } catch (err) {
          statusText = 'Network Error';
          badgeClass = 'error';
          badgeLabel = '❌ Network Error';
        }

        resultsHtml += `
          <tr>
            <td><strong>${parkName}</strong></td>
            <td><code style="font-size: 0.8rem; cursor:pointer;" onclick="setPreset('${uuid}', '${parkName}')" title="Click to test in Inspector">${uuid}</code></td>
            <td>${statusText}</td>
            <td><strong>${itemCount}</strong></td>
            <td><span class="badge-status ${badgeClass}">${badgeLabel}</span></td>
          </tr>
        `;
      }

      resultsHtml += `</tbody></table>`;
      container.innerHTML = resultsHtml;
      statusLabel.textContent = `Audit Complete (${spreadsheetParks.length} spreadsheet parks tested)`;
    }

    document.getElementById('sendBtn').addEventListener('click', sendApiRequest);
    document.getElementById('auditBtn').addEventListener('click', auditAllParks);
    document.getElementById('endpointSelect').addEventListener('change', (e) => {
      const isDest = e.target.value === 'destinations';
      document.getElementById('uuidInput').style.display = isDest ? 'none' : 'block';
    });

    // Initial load of spreadsheet parks on page open
    loadSpreadsheetParks();
  </script>
</body>
</html>
